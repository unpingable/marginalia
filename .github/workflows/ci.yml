name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      qualification_fixture:
        description: Manual CI negative control; ordinary runs always use normal
        required: true
        default: normal
        type: choice
        options:
          - normal
          - fail
          - hang

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  AG_NG_CONTRACT_COMMIT: 466dcf2d2dc1ec63ebbde2c7f0b53f2fcf666b95
  DOCKET_CONTRACT_COMMIT: 181589f910b76030b312d6478bd0ac813a630855

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Marginalia
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-build.lock
            requirements-dev.lock

      - name: Install static and build dependencies
        run: >-
          python -m pip install
          -r requirements.lock
          -r requirements-build.lock
          -r requirements-dev.lock

      - name: Lint
        run: make lint

      - name: Check formatting
        run: make fmt-check

      - name: Check browser JavaScript startup
        run: node tools/check-browser-startup.js

      - name: Build Python distributions
        run: make build

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Marginalia
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Checkout the qualified ag-ng contract
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: unpingable/ag_ng
          ref: ${{ env.AG_NG_CONTRACT_COMMIT }}
          path: _ag_ng

      - name: Checkout the qualified Docket contract
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: unpingable/docket
          ref: ${{ env.DOCKET_CONTRACT_COMMIT }}
          path: _docket

      - name: Verify the ag-ng and Docket contracts
        run: |
          test "$(tr -d '[:space:]' < AG_NG_CONTRACT_COMMIT)" = "$AG_NG_CONTRACT_COMMIT"
          test "$(git -C _ag_ng rev-parse HEAD)" = "$AG_NG_CONTRACT_COMMIT"
          test "$(tr -d '[:space:]' < DOCKET_CONTRACT_COMMIT)" = "$DOCKET_CONTRACT_COMMIT"
          test "$(git -C _docket rev-parse HEAD)" = "$DOCKET_CONTRACT_COMMIT"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-build.lock
            requirements-dev.lock

      - name: Install the exact test contract
        run: |
          python -m pip install \
            -r requirements.lock \
            -r requirements-build.lock \
            -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps ./receipt-v1
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Controlled negative qualification fixture
        if: github.event_name == 'workflow_dispatch' && inputs.qualification_fixture != 'normal'
        run: |
          case "${{ inputs.qualification_fixture }}" in
            fail)
              echo "Controlled failure fixture: CI must report this job as failed."
              exit 1
              ;;
            hang)
              echo "Controlled hanging fixture: timeout must stop it after five seconds."
              timeout --signal=TERM --kill-after=2s 5s \
                python -c 'import time; time.sleep(3600)'
              ;;
          esac

      - name: Run the deterministic qualification suite
        env:
          MARGINALIA_AG_NG_SOURCE_DIR: ${{ github.workspace }}/_ag_ng
          MARGINALIA_DOCKET_SOURCE_DIR: ${{ github.workspace }}/_docket
        run: make test

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Marginalia
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm

      - name: Install locked browser dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Exercise writer-facing reliability controls
        run: npm run test:browser

  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Marginalia
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Checkout the qualified ag-ng contract
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: unpingable/ag_ng
          ref: ${{ env.AG_NG_CONTRACT_COMMIT }}
          path: _ag_ng

      - name: Checkout the qualified Docket contract
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: unpingable/docket
          ref: ${{ env.DOCKET_CONTRACT_COMMIT }}
          path: _docket

      - name: Verify all qualified contracts
        run: |
          test "$(git -C _ag_ng rev-parse HEAD)" = "$AG_NG_CONTRACT_COMMIT"
          test "$(git -C _docket rev-parse HEAD)" = "$DOCKET_CONTRACT_COMMIT"

      - name: Stage the exact local dependencies
        env:
          MARGINALIA_AG_NG_SOURCE_DIR: ${{ github.workspace }}/_ag_ng
          MARGINALIA_DOCKET_SOURCE_DIR: ${{ github.workspace }}/_docket
        run: ./sync-deps.sh

      - name: Build the production image
        run: docker build --tag marginalia:ci .

      - name: Smoke the built image
        run: |
          docker run --rm --entrypoint python3 marginalia:ci -c \
            'import importlib.metadata as m; import gov_webui, receipt_v1; names={d.metadata["Name"].lower() for d in m.distributions()}; assert "agent-governor" not in names and "receipt-kernel" not in names'
          docker run --rm --entrypoint /opt/codex/codex marginalia:ci --version
          docker run --rm --entrypoint /usr/local/bin/ag-providerd marginalia:ci --help
          docker run --rm --entrypoint /usr/local/bin/ag-providerctl marginalia:ci --help
          docker run --rm --entrypoint /usr/local/bin/docket marginalia:ci --help
