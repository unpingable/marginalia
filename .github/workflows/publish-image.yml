name: Publish Marginalia appliance

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/marginalia

permissions:
  contents: write
  packages: write

jobs:
  verify-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Marginalia
        uses: actions/checkout@v4

      - name: Checkout the qualified ag-ng contract
        uses: actions/checkout@v4
        with:
          repository: unpingable/ag_ng
          ref: c3210f156208b22bf21e7bd1910a84a85b519538
          path: _ag_ng
          fetch-depth: 1

      - name: Checkout the qualified Docket contract
        uses: actions/checkout@v4
        with:
          repository: unpingable/docket
          ref: 181589f910b76030b312d6478bd0ac813a630855
          path: _docket
          fetch-depth: 1

      - name: Verify immutable source contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _ag_ng rev-parse HEAD)" = "$(tr -d '[:space:]' < AG_NG_CONTRACT_COMMIT)"
          test "$(git -C _docket rev-parse HEAD)" = "$(tr -d '[:space:]' < DOCKET_CONTRACT_COMMIT)"
          test -d receipt-v1/src/receipt_v1
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            package_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            test "${GITHUB_REF_NAME#v}" = "$package_version"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the exact development contract
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps ./receipt-v1
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Verify Marginalia
        run: |
          python -m ruff check src tests
          MARGINALIA_AG_NG_SOURCE_DIR="$PWD/_ag_ng" \
          MARGINALIA_DOCKET_SOURCE_DIR="$PWD/_docket" \
            python -m pytest -q
          python -m build --no-isolation

      - name: Stage the complete qualified AG distribution
        shell: bash
        run: |
          set -euo pipefail
          MARGINALIA_AG_NG_SOURCE_DIR="$PWD/_ag_ng" \
          MARGINALIA_DOCKET_SOURCE_DIR="$PWD/_docket" \
            ./sync-deps.sh
          rm -rf _ag_ng _docket

      - name: Build and smoke the local appliance image
        run: |
          docker build --tag marginalia:ci .
          docker run --rm --entrypoint python3 marginalia:ci -c \
            'import importlib.metadata as m; import gov_webui, receipt_v1; names={d.metadata["Name"].lower() for d in m.distributions()}; assert "agent-governor" not in names and "receipt-kernel" not in names'
          docker run --rm --entrypoint /opt/codex/codex marginalia:ci --version
          docker run --rm --entrypoint /usr/local/bin/ag-loopctl marginalia:ci --help
          docker run --rm --entrypoint /usr/local/bin/ag-providerd marginalia:ci --help
          docker run --rm --entrypoint /usr/local/bin/ag-providerctl marginalia:ci --help
          docker run --rm --entrypoint /usr/local/bin/docket marginalia:ci --help

      - name: Set up emulation for the arm64 appliance
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and publish the multi-architecture appliance
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
