# Optional local Ollama provider. AG remains the provider owner.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: marginalia-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  marginalia:
    environment:
      - BACKEND_TYPE=ollama
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama

volumes:
  ollama_data:
