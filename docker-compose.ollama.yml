# Optional local Ollama service. Configure its container URL in providers.json;
# ag-providerd remains the only process allowed to dispatch to it.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: marginalia-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  marginalia-providerd:
    depends_on:
      - ollama

volumes:
  ollama_data:
