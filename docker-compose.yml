# Marginalia — one standalone governed creative-writing application.

services:
  marginalia:
    image: ${MARGINALIA_IMAGE:-marginalia:local}
    container_name: marginalia
    ports:
      - "${MARGINALIA_PORT:-8000}:8000"
    environment:
      - BACKEND_TYPE=${BACKEND_TYPE:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOVERNOR_CONTEXT_ID=${GOVERNOR_CONTEXT_ID:-erin-writing}
      - GOVERNOR_MODE=fiction
      - MARGINALIA_DATA_ROOT=/data
    volumes:
      - marginalia_data:/data
    restart: unless-stopped

volumes:
  marginalia_data:
