# Marginalia — one standalone governed creative-writing application.

services:
  marginalia:
    image: ${MARGINALIA_IMAGE:-ghcr.io/unpingable/marginalia:0.1.0}
    container_name: marginalia
    ports:
      - "${MARGINALIA_BIND_HOST:-127.0.0.1}:${MARGINALIA_PORT:-8000}:8000"
    environment:
      - GOVERNOR_CONTEXT_ID=${GOVERNOR_CONTEXT_ID:-erin-writing}
      - GOVERNOR_MODE=fiction
      - MARGINALIA_DATA_ROOT=/data
      - MARGINALIA_CONTEXTS_DIR=/data/.marginalia/contexts
      - MARGINALIA_BACKUP_ROOT=/backups
      - MARGINALIA_BACKUP_REQUIRE_REMOTE=${MARGINALIA_BACKUP_REQUIRE_REMOTE:-false}
      - MARGINALIA_DEPLOYMENT_ID=${MARGINALIA_DEPLOYMENT_ID:-compose}
      - MARGINALIA_ALLOWED_ORIGINS=${MARGINALIA_ALLOWED_ORIGINS:-}
      - MARGINALIA_CONTEXT_MAINTENANCE_MODEL=${MARGINALIA_CONTEXT_MAINTENANCE_MODEL:-claude-context-summary}
      - MARGINALIA_DURABLE_GENERATION_AVAILABLE=true
      - MARGINALIA_MODEL_CONFIG=/etc/marginalia/providers.json
      - MARGINALIA_EVIDENCE_KEY_FILE=/run/secrets/marginalia-evidence-keys.json
    volumes:
      - marginalia_data:/data
      - marginalia_runtime:/run/marginalia
      - ${MARGINALIA_AG_NG_CONFIG_HOST_PATH:-./ag-ng-config}:/run/marginalia-input/config:ro
      - ${MARGINALIA_GENERATION_SECRETS_HOST_PATH:-./secrets}/marginalia-evidence-keys.json:/run/marginalia-input/web-secrets/marginalia-evidence-keys.json:ro
      - ${MARGINALIA_BACKUP_HOST_PATH:-./backups}:/backups
    depends_on:
      marginalia-providerd:
        condition: service_healthy
      marginalia-generation:
        condition: service_started
    restart: unless-stopped

  marginalia-generation:
    image: ${MARGINALIA_IMAGE:-ghcr.io/unpingable/marginalia:0.1.0}
    container_name: marginalia-generation
    command: ["/app/generation-worker-entrypoint.sh"]
    environment:
      - MARGINALIA_DATA_ROOT=/data
      - MARGINALIA_CONTEXTS_DIR=/data/.marginalia/contexts
      - MARGINALIA_AG_ISSUER_KEY_FILE=/run/secrets/marginalia-generation/marginalia-ag-issuer.pk8
      - MARGINALIA_EVIDENCE_KEY_FILE=/run/secrets/marginalia-generation/marginalia-evidence-keys.json
      - MARGINALIA_EVIDENCE_RETENTION_DAYS=${MARGINALIA_EVIDENCE_RETENTION_DAYS:-30}
      - MARGINALIA_GENERATION_POLL_SECONDS=${MARGINALIA_GENERATION_POLL_SECONDS:-2}
      - MARGINALIA_AG_PROVIDERCTL=/usr/local/bin/ag-providerctl
      - MARGINALIA_AG_PROVIDERCTL_CONFIG=/etc/marginalia/providerctl.toml
      - MARGINALIA_MODEL_CONFIG=/etc/marginalia/providers.json
    volumes:
      - marginalia_data:/data
      - marginalia_runtime:/run/marginalia
      - ${MARGINALIA_AG_NG_CONFIG_HOST_PATH:-./ag-ng-config}:/run/marginalia-input/config:ro
      - ${MARGINALIA_GENERATION_SECRETS_HOST_PATH:-./secrets}/marginalia-ag-issuer.pk8:/run/marginalia-input/worker-secrets/marginalia-ag-issuer.pk8:ro
      - ${MARGINALIA_GENERATION_SECRETS_HOST_PATH:-./secrets}/marginalia-evidence-keys.json:/run/marginalia-input/worker-secrets/marginalia-evidence-keys.json:ro
      - ${MARGINALIA_GENERATION_SECRETS_HOST_PATH:-./secrets}/providerctl/rpc.pk8:/run/marginalia-input/worker-secrets/rpc.pk8:ro
    depends_on:
      marginalia-providerd:
        condition: service_started
    healthcheck:
      disable: true
    restart: unless-stopped

  marginalia-providerd:
    image: ${MARGINALIA_IMAGE:-ghcr.io/unpingable/marginalia:0.1.0}
    container_name: marginalia-providerd
    command: ["/app/providerd-entrypoint.sh"]
    environment:
      - CREDENTIALS_DIRECTORY=/run/credentials/marginalia-providerd
    volumes:
      - marginalia_providerd_data:/var/lib/agent-governor/providerd
      - marginalia_runtime:/run/marginalia
      - ${MARGINALIA_AG_NG_CONFIG_HOST_PATH:-./ag-ng-config}:/run/marginalia-input/config:ro
      - ${MARGINALIA_GENERATION_SECRETS_HOST_PATH:-./secrets}/providerd:/run/marginalia-input/providerd-secrets:ro
      - ${MARGINALIA_PROVIDER_WORK_HOST_PATH:-./provider-work}:/var/lib/marginalia/provider-work
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/marginalia/providerd/provider.sock"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  marginalia-backup:
    image: ${MARGINALIA_IMAGE:-ghcr.io/unpingable/marginalia:0.1.0}
    container_name: marginalia-backup
    command: ["python3", "-m", "gov_webui.backup_worker"]
    environment:
      - GOVERNOR_CONTEXT_ID=${GOVERNOR_CONTEXT_ID:-erin-writing}
      - MARGINALIA_DATA_ROOT=/data
      - MARGINALIA_BACKUP_ROOT=/backups
      - MARGINALIA_BACKUP_REQUIRE_REMOTE=${MARGINALIA_BACKUP_REQUIRE_REMOTE:-false}
      - MARGINALIA_BACKUP_POLL_SECONDS=${MARGINALIA_BACKUP_POLL_SECONDS:-900}
      - MARGINALIA_DEPLOYMENT_ID=${MARGINALIA_DEPLOYMENT_ID:-compose}
    volumes:
      - marginalia_data:/data:ro
      - ${MARGINALIA_BACKUP_HOST_PATH:-./backups}:/backups
    healthcheck:
      disable: true
    restart: unless-stopped

  marginalia-synthetic:
    image: ${MARGINALIA_IMAGE:-ghcr.io/unpingable/marginalia:0.1.0}
    container_name: marginalia-synthetic
    command: ["python3", "-m", "gov_webui.synthetic_worker"]
    environment:
      - GOVERNOR_AUTH_TOKEN=${GOVERNOR_AUTH_TOKEN:-}
      - MARGINALIA_SYNTHETIC_BASE_URL=http://marginalia:8000
      - MARGINALIA_SYNTHETIC_MODELS=${MARGINALIA_SYNTHETIC_MODELS:-default@3600}
      - MARGINALIA_SYNTHETIC_TIMEOUT_SECONDS=${MARGINALIA_SYNTHETIC_TIMEOUT_SECONDS:-1840}
      - MARGINALIA_SYNTHETIC_POLL_SECONDS=${MARGINALIA_SYNTHETIC_POLL_SECONDS:-60}
      - MARGINALIA_SYNTHETIC_RECORD_PATH=/backups/marginalia-synthetics.jsonl
    volumes:
      - ${MARGINALIA_BACKUP_HOST_PATH:-./backups}:/backups
    depends_on:
      marginalia:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  marginalia_data:
  marginalia_runtime:
  marginalia_providerd_data:
