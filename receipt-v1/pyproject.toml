[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "receipt-v1"
version = "0.1.0"
description = "Receipt v1 Schema: runtime-agnostic audit trail for tool governance"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "James Beck" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/receipt_v1"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "schema/",
    "examples/",
    "tests/",
    "pyproject.toml",
    "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 30
